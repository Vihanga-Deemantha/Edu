name: Nightly recommender training

on:
  schedule:
    # 21:30 UTC = 03:00 Asia/Colombo — low-traffic hours
    - cron: "30 21 * * *"
  workflow_dispatch: {}

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
